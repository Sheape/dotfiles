---
- name: "{{ category }} | Checking for Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}-package.yml"
  register: distribution_config

- name: "{{ category }} | Run Tasks: {{ ansible_distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}-package.yml"
  when: distribution_config.stat.exists
  loop: "{{ packages }}"
  loop_control:
    loop_var: pkg

- name: "{{ category }} | Install packages"
  become: true
  ansible.builtin.shell: "/opt/texlive/2024/bin/x86_64-linux/tlmgr install biber
  biber.x86_64-linux biblatex biblatex-apa cm etex fancyhdr fontaxes hyph-utf8
  hyphen-base iftex import knuth-lib kpathsea kpathsea.x86_64-linux l3backend
  l3kernel l3packages libertine luatex luatex.x86_64-linux mweights plain
  scheme-infraonly tex-ini-files texlive-scripts texlive-scripts.x86_64-linux
  texlive.infra texlive.infra.x86_64-linux unicode-data xkeyval scheme-minimal
  latex-bin hyperref xcolor titlesec fontspec enumitem url luacolor
  lua-ul amsmath capt-of wrapfig libertine tools ulem epstopdf-pkg"
